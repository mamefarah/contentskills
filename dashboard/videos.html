<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My videos · ContentSkills</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme-studio.css">
<style>
  #sidebar .back{display:block;font-size:13.5px;font-weight:700;color:var(--accent);text-decoration:none}
  #sidebar .back:hover{text-decoration:underline}
  .videos-main{margin-left:var(--side);padding:38px 40px 80px;max-width:1100px}
  .all ol{list-style:none;margin:24px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .all a.vid{display:block;padding:16px 18px;border-radius:16px;background:var(--panel);box-shadow:var(--shadow);color:var(--cream);text-decoration:none;transition:box-shadow .18s,transform .18s}
  .all a.vid:hover{box-shadow:var(--shadow-lift);transform:translateY(-1px)}
  .all a.vid b{display:block;font-size:15.5px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .all a.vid small{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:13px;color:var(--muted)}
  .all a.vid small em{font-style:normal;font-weight:700;color:var(--accent);white-space:nowrap}
  #status-filter{margin-top:18px}
  .all a.vid.final{box-shadow:inset 3px 0 0 #16A34A,var(--shadow)}
  .all a.vid.final small span{color:#16A34A;font-weight:700}
  .all a.vid.done small span{color:#16A34A}.all a.vid.ask small span{color:var(--pink)}
  .all li.empty{color:var(--muted)}
  .all li:has(details){grid-column:1/-1}
  .all .demos summary{cursor:pointer;margin-top:18px;font-weight:700;color:var(--muted)}
  .all .demos ol{margin-top:12px}
  @media (max-width:820px){.videos-main{margin-left:0;padding:24px 16px 60px}}
</style>
</head>
<body>
<aside id="sidebar">
  <a class="brand" href="/dashboard/"><span>ContentSkills</span>My videos</a>
  <a class="back" href="/dashboard/">← Dashboard</a>
  <a class="back" href="/dashboard/gallery.html">Finished videos gallery →</a>
</aside>
<main class="videos-main" id="top">
  <header class="hero"><h1>My videos</h1><p id="tally">Loading…</p></header>
  <div class="chips" id="status-filter" hidden><button class="chip" data-show="all" aria-pressed="true">All</button><button class="chip" data-show="wip" aria-pressed="false">In progress</button><button class="chip" data-show="final" aria-pressed="false">Final</button></div>
  <section class="all mine" aria-label="All my videos"><ol id="mine"><li class="empty">Loading…</li></ol></section>
</main>
<script type="module" src="my-videos.js"></script>
</body>
</html>
